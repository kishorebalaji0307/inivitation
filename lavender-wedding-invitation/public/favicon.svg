<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient: Deep Royal Lavender / Imperial Purple -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#431C6B" />
      <stop offset="50%" stop-color="#30114F" />
      <stop offset="100%" stop-color="#1E0733" />
    </linearGradient>

    <!-- Antique Gold Gradient for Border, Monogram & Foliage -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2D6" />
      <stop offset="35%" stop-color="#E5C57E" />
      <stop offset="70%" stop-color="#C5A059" />
      <stop offset="100%" stop-color="#99742E" />
    </linearGradient>

    <!-- Lavender Petal Radiant Gradient -->
    <linearGradient id="lavenderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#EBDCF9" />
      <stop offset="100%" stop-color="#B885E7" />
    </linearGradient>

    <!-- Soft Drop Shadow for High Contrast on Light & Dark Tabs -->
    <filter id="softGlow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle with Antique Gold Rim -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.2" />

  <!-- Inner Delicate Antique-Gold Dashed Inset Frame -->
  <rect x="5.5" y="5.5" width="53" height="53" rx="13" fill="none" stroke="#E5C57E" stroke-width="0.75" stroke-opacity="0.55" stroke-dasharray="3 1.5" />

  <!-- Top Floral Element: Lavender Rose Blossom with Antique-Gold Leaves -->
  <g transform="translate(32, 11)" filter="url(#softGlow)">
    <!-- Golden Leaf Sprigs -->
    <path d="M-1.5,1.2 C-4,-0.5 -6.5,-0.2 -8,2 C-5.8,2.8 -3.5,2.5 -1.5,1.2 Z" fill="url(#goldGrad)" />
    <path d="M1.5,1.2 C4,-0.5 6.5,-0.2 8,2 C5.8,2.8 3.5,2.5 1.5,1.2 Z" fill="url(#goldGrad)" />
    <!-- Lavender Blossom Petals -->
    <circle cx="-2.2" cy="-1" r="2.2" fill="url(#lavenderGrad)" />
    <circle cx="2.2" cy="-1" r="2.2" fill="url(#lavenderGrad)" />
    <circle cx="0" cy="-2.6" r="2.3" fill="url(#lavenderGrad)" />
    <!-- Center Golden Gem Core -->
    <circle cx="0" cy="-0.6" r="1.2" fill="url(#goldGrad)" />
  </g>

  <!-- Elegant 'S & S' Monogram (Sasi & Swetha) -->
  <g filter="url(#softGlow)" text-anchor="middle">
    <!-- Left 'S' (Sasi) in Antique Gold -->
    <text x="20.5" y="42" font-family="'Cinzel', 'Playfair Display', 'Cormorant Garamond', 'Georgia', serif" font-size="26" font-weight="700" fill="url(#goldGrad)" letter-spacing="-0.5">S</text>

    <!-- Center '&' in Romantic Soft Lavender Light -->
    <text x="32" y="38" font-family="'Alex Brush', 'Cinzel', 'Georgia', serif" font-size="15" font-weight="600" fill="#FAF6FE">&amp;</text>

    <!-- Right 'S' (Swetha) in Antique Gold -->
    <text x="43.5" y="42" font-family="'Cinzel', 'Playfair Display', 'Cormorant Garamond', 'Georgia', serif" font-size="26" font-weight="700" fill="url(#goldGrad)" letter-spacing="-0.5">S</text>
  </g>

  <!-- Bottom Delicate Antique Gold Laurel Swag & Pearls -->
  <g filter="url(#softGlow)">
    <path d="M 18,50.5 C 24,53.8 40,53.8 46,50.5" fill="none" stroke="url(#goldGrad)" stroke-width="1.3" stroke-linecap="round" />
    <circle cx="32" cy="52.4" r="1.4" fill="url(#goldGrad)" />
    <circle cx="26" cy="51.5" r="0.9" fill="url(#goldGrad)" opacity="0.85" />
    <circle cx="38" cy="51.5" r="0.9" fill="url(#goldGrad)" opacity="0.85" />
  </g>
</svg>
